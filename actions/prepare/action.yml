name: semfrag prepare
description: Merge changelog fragments and finalize the unreleased section, outputting the new version and release notes.
author: Joe Polny

inputs:
  version:
    description: semfrag version to install, e.g. `0.7.0`, or `latest`. Defaults to the version of the commit this action is pinned to.
    required: false
    default: ""
  install:
    description: Install the standalone semfrag binary. Set to `false` to use a `semfrag` already on PATH.
    required: false
    default: "true"
  changelog:
    description: Changelog file.
    required: false
    default: CHANGELOG.md
  fragments-dir:
    description: Directory containing changelog fragments.
    required: false
    default: changelog.d
  config:
    description: semfrag config file. Defaults to semfrag's own default (`semfrag.json`).
    required: false
    default: ""
  prerelease:
    description: Channel to promote to. One of `alpha`, `beta` or `rc`. Empty promotes to a stable release.
    required: false
    default: ""

outputs:
  released:
    description: "`true` if a new version was released, otherwise `false`."
    value: ${{ steps.release.outputs.released }}
  version:
    description: The released version, e.g. `1.2.0`. Empty when nothing was released.
    value: ${{ steps.release.outputs.version }}
  notes:
    description: The release notes of the released version.
    value: ${{ steps.release.outputs.notes }}
  notes-file:
    description: Path to a file containing the release notes.
    value: ${{ steps.release.outputs.notes-file }}

runs:
  using: composite
  steps:
    - name: Install semfrag
      if: inputs.install == 'true'
      shell: bash
      env:
        SEMFRAG_INSTALL_VERSION: ${{ inputs.version }}
      run: bash "$GITHUB_ACTION_PATH/../setup/install.sh"

    - name: Generate and release
      id: release
      shell: bash
      env:
        CHANGELOG: ${{ inputs.changelog }}
        FRAGMENTS_DIR: ${{ inputs.fragments-dir }}
        CONFIG: ${{ inputs.config }}
        PRERELEASE: ${{ inputs.prerelease }}
      run: |
        set -euo pipefail

        # The rollback action restores the branch to this commit if a later
        # step in the job fails after the release commit was pushed.
        echo "SEMFRAG_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

        args=(--dir "$FRAGMENTS_DIR" --output "$CHANGELOG")
        if [ -n "$CONFIG" ]; then
          args+=(--config "$CONFIG")
        fi

        channel="${PRERELEASE:-stable}"
        case "$channel" in
          stable | alpha | beta | rc) ;;
          *)
            echo "Unsupported prerelease channel: ${channel}. Use alpha, beta or rc." >&2
            exit 1
            ;;
        esac

        semfrag generate "${args[@]}"

        if ! grep -qE '^# .*UNRELEASED' "$CHANGELOG"; then
          # Even without an unreleased section there can still be a release to
          # make when the current top moves forward along the promotion ladder,
          # such as alpha to beta or a prerelease to stable. A dry-run promote
          # applies the same rules without writing, so an invalid move means
          # there is nothing to release.
          if ! semfrag promote "${args[@]}" "$channel" --dry-run >/dev/null 2>&1; then
            echo "No unreleased changes; nothing to release."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest="$(semfrag latest --output "$CHANGELOG" 2>/dev/null || true)"
          echo "Promoting ${latest:-the current version} to a ${channel} release."
        fi

        semfrag promote "${args[@]}" "$channel"

        version="$(semfrag latest --output "$CHANGELOG")"
        notes_file="${RUNNER_TEMP}/semfrag/notes.md"
        mkdir -p "$(dirname "$notes_file")"
        semfrag notes --output "$CHANGELOG" > "$notes_file"
        new_delimiter() {
          printf 'SEMFRAG_NOTES_%s' "$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
        }
        delimiter="$(new_delimiter)"
        while grep -Fqx "$delimiter" "$notes_file"; do
          delimiter="$(new_delimiter)"
        done
        changelog_delimiter="$(new_delimiter)"
        while grep -Fqx "$changelog_delimiter" <<< "$CHANGELOG"; do
          changelog_delimiter="$(new_delimiter)"
        done

        {
          echo "released=true"
          echo "version=${version}"
          echo "notes-file=${notes_file}"
          echo "notes<<${delimiter}"
          cat "$notes_file"
          echo "$delimiter"
        } >> "$GITHUB_OUTPUT"
        {
          echo "SEMFRAG_VERSION=${version}"
          echo "SEMFRAG_CHANGELOG<<${changelog_delimiter}"
          printf '%s\n' "$CHANGELOG"
          echo "$changelog_delimiter"
          echo "SEMFRAG_NOTES_FILE=${notes_file}"
        } >> "$GITHUB_ENV"
        echo "Released ${version}."
