name: semfrag publish
description: Commit the release, push it, tag it and create a GitHub release with the semfrag release notes.
author: Joe Polny

inputs:
  version:
    description: Version to publish. Defaults to the version released by the prepare action in this job.
    required: false
    default: ""
  notes-file:
    description: File containing the release notes. Defaults to the notes written by the prepare action in this job.
    required: false
    default: ""
  branch:
    description: Branch to push the release commit to.
    required: false
    default: ${{ github.ref_name }}
  tag-prefix:
    description: Prefix of the git tag, e.g. `v` for `v1.2.0`.
    required: false
    default: v
  commit-message:
    description: Message of the release commit. `{tag}` and `{version}` are replaced with the tag and version.
    required: false
    default: "chore: release {tag} [skip ci]"
  assets:
    description: Newline-separated glob patterns of files to upload to the GitHub release. Each pattern must match at least one file.
    required: false
    default: ""
  git-user-name:
    description: Author name of the release commit.
    required: false
    default: github-actions[bot]
  git-user-email:
    description: Author email of the release commit.
    required: false
    default: 41898282+github-actions[bot]@users.noreply.github.com
  token:
    description: "Token used to create the GitHub release. Needs `contents: write`."
    required: false
    default: ${{ github.token }}

outputs:
  tag:
    description: The pushed tag.
    value: ${{ steps.commit.outputs.tag }}
  commit-sha:
    description: The commit the tag and release point to.
    value: ${{ steps.commit.outputs.commit-sha }}

runs:
  using: composite
  steps:
    - name: Commit, push and tag
      id: commit
      shell: bash
      env:
        VERSION: ${{ inputs.version || env.SEMFRAG_VERSION }}
        BRANCH: ${{ inputs.branch }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
        GIT_USER_NAME: ${{ inputs.git-user-name }}
        GIT_USER_EMAIL: ${{ inputs.git-user-email }}
      run: |
        set -euo pipefail

        if [ -z "$VERSION" ]; then
          echo "::error::No version to publish. Run the semfrag prepare action first or pass the version input."
          exit 1
        fi

        tag="${TAG_PREFIX}${VERSION}"
        message="${COMMIT_MESSAGE//\{tag\}/$tag}"
        message="${message//\{version\}/$VERSION}"
        {
          echo "SEMFRAG_TAG=${tag}"
          echo "SEMFRAG_BRANCH=${BRANCH}"
          echo "SEMFRAG_TAG_CREATE_ATTEMPTED=false"
        } >> "$GITHUB_ENV"
        echo "tag=${tag}" >> "$GITHUB_OUTPUT"

        git config user.name "$GIT_USER_NAME"
        git config user.email "$GIT_USER_EMAIL"
        git add -u
        if git diff --cached --quiet; then
          echo "No changes to commit."
        else
          git commit -m "$message"
        fi

        # Recorded before pushing so the rollback action knows which commit
        # this run owns even if the push itself fails part way.
        run_commit_sha="$(git rev-parse HEAD)"
        echo "SEMFRAG_RUN_COMMIT_SHA=${run_commit_sha}" >> "$GITHUB_ENV"
        echo "commit-sha=${run_commit_sha}" >> "$GITHUB_OUTPUT"
        git push origin "HEAD:refs/heads/${BRANCH}"

        if git ls-remote --refs --exit-code origin "refs/tags/${tag}" >/dev/null 2>&1; then
          echo "Tag ${tag} already exists."
        else
          git tag -f "$tag" "$run_commit_sha"
          echo "SEMFRAG_TAG_CREATE_ATTEMPTED=true" >> "$GITHUB_ENV"
          git push origin "refs/tags/${tag}"
        fi

    - name: Create GitHub release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        VERSION: ${{ inputs.version || env.SEMFRAG_VERSION }}
        NOTES_FILE: ${{ inputs.notes-file || env.SEMFRAG_NOTES_FILE }}
        TAG: ${{ steps.commit.outputs.tag }}
        RUN_COMMIT_SHA: ${{ steps.commit.outputs.commit-sha }}
        ASSETS: ${{ inputs.assets }}
      run: |
        set -euo pipefail

        echo "SEMFRAG_RELEASE_CREATE_ATTEMPTED=false" >> "$GITHUB_ENV"
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "Release ${TAG} already exists."
        else
          notes=""
          if [ -n "$NOTES_FILE" ]; then
            notes="$(cat "$NOTES_FILE")"
          fi
          # The marker lets the rollback action tell a release created by this
          # run apart from one created by someone else.
          release_marker="<!-- semfrag-release-run:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT} -->"
          printf -v release_notes '%s\n\n%s' "$notes" "$release_marker"
          release_args=(--title "$TAG" --target "$RUN_COMMIT_SHA" --notes "$release_notes")
          if [[ "$VERSION" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          echo "SEMFRAG_RELEASE_CREATE_ATTEMPTED=true" >> "$GITHUB_ENV"
          gh release create "$TAG" "${release_args[@]}"
        fi

        if [ -n "$ASSETS" ]; then
          files=()
          while IFS= read -r pattern; do
            [ -n "$pattern" ] || continue
            matches=()
            for match in $pattern; do
              [ -e "$match" ] && matches+=("$match")
            done
            if [ "${#matches[@]}" -eq 0 ]; then
              echo "::error::No files match asset pattern: ${pattern}"
              exit 1
            fi
            files+=("${matches[@]}")
          done <<< "$ASSETS"
          gh release upload "$TAG" "${files[@]}" --clobber
        fi
