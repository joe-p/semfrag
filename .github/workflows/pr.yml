name: PR

on:
  pull_request:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format

      - name: Check types
        run: bun run check-types

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Put the built CLI on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/semfrag-dev"
          printf '#!/bin/sh\nexec bun "%s/dist/cli.js" "$@"\n' "$PWD" > "$RUNNER_TEMP/semfrag-dev/semfrag"
          chmod +x "$RUNNER_TEMP/semfrag-dev/semfrag"
          echo "$RUNNER_TEMP/semfrag-dev" >> "$GITHUB_PATH"

      - name: Check changelog
        uses: ./actions/check
        with:
          install: false
          require-fragment-for: ^src/

  setup-action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install the released binary
        id: setup
        uses: ./actions/setup

      - name: Run semfrag
        shell: bash
        run: |
          semfrag --version
          test "$(semfrag --version)" = "${{ steps.setup.outputs.version }}"
