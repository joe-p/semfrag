name: PR

on:
  pull_request:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

      - name: Put the built CLI on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/semfrag-dev"
          go build -o "$RUNNER_TEMP/semfrag-dev/semfrag" ./cmd/semfrag
          echo "$RUNNER_TEMP/semfrag-dev" >> "$GITHUB_PATH"

      - name: Check changelog
        uses: ./actions/check
        with:
          install: false
          require-fragment-for: \.go$

  setup-action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install the released binary
        id: setup
        uses: ./actions/setup

      - name: Run semfrag
        shell: bash
        run: |
          semfrag --version
          test "$(semfrag --version)" = "${{ steps.setup.outputs.version }}"
