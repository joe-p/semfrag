name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Record base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # npm is still used to publish: it supports OIDC trusted publishing,
      # which bun publish does not (oven-sh/bun#22423).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Merge pending fragments
        run: bun dist/cli.js generate

      - name: Check for an unreleased section
        id: unreleased
        run: |
          if grep -qE '^# .*UNRELEASED' CHANGELOG.md; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Finalize release
        id: release
        if: steps.unreleased.outputs.found == 'true'
        run: |
          bun dist/cli.js release
          version="$(bun dist/cli.js latest)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "notes<<SEMFRAG_NOTES_EOF" >> "$GITHUB_OUTPUT"
          bun dist/cli.js notes >> "$GITHUB_OUTPUT"
          echo "SEMFRAG_NOTES_EOF" >> "$GITHUB_OUTPUT"

      - name: Bump package.json version
        if: steps.release.outputs.version != ''
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: bun pm pkg set "version=${VERSION}"

      - name: Commit and tag
        id: artifacts
        if: steps.release.outputs.version != ''
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          echo "tag_create_attempted=false" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changelog changes to commit."
          else
            git commit -m "chore: release v${VERSION} [skip ci]"
          fi
          git push origin HEAD:main
          run_commit_sha="$(git rev-parse HEAD)"
          echo "commit_sha=${run_commit_sha}" >> "$GITHUB_OUTPUT"
          if git ls-remote --refs --exit-code origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists."
          else
            git tag -f "v${VERSION}" "$run_commit_sha"
            echo "tag_create_attempted=true" >> "$GITHUB_OUTPUT"
            git push origin "v${VERSION}"
          fi

      - name: Build standalone binaries
        if: steps.release.outputs.version != ''
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: bun run scripts/build-binaries.ts

      - name: Create GitHub release
        id: github_release
        if: steps.release.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          RUN_COMMIT_SHA: ${{ steps.artifacts.outputs.commit_sha }}
          NOTES: ${{ steps.release.outputs.notes }}
        run: |
          echo "release_create_attempted=false" >> "$GITHUB_OUTPUT"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists."
          else
            release_marker="<!-- semfrag-release-run:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT} -->"
            printf -v release_notes '%s\n\n%s' "$NOTES" "$release_marker"
            echo "release_create_attempted=true" >> "$GITHUB_OUTPUT"
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --target "$RUN_COMMIT_SHA" \
              --notes "$release_notes"
          fi
          gh release upload "v${VERSION}" build/binaries/* --clobber

      - name: Publish to npm
        if: steps.release.outputs.version != ''
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if npm view "semfrag@${VERSION}" version >/dev/null 2>&1; then
            echo "semfrag@${VERSION} is already published."
          else
            npm publish --access public
          fi

      - name: Roll back failed release
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          RUN_COMMIT_SHA: ${{ steps.artifacts.outputs.commit_sha }}
          TAG_CREATE_ATTEMPTED: ${{ steps.artifacts.outputs.tag_create_attempted }}
          RELEASE_CREATE_ATTEMPTED: ${{ steps.github_release.outputs.release_create_attempted }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$RELEASE_CREATE_ATTEMPTED" = "true" ] && [ -n "$RUN_COMMIT_SHA" ]; then
            release_marker="<!-- semfrag-release-run:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT} -->"
            release_info="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}" 2>/dev/null || true)"
            if [ -n "$release_info" ] && jq -e \
              --arg tag "v${VERSION}" \
              --arg commit "$RUN_COMMIT_SHA" \
              --arg marker "$release_marker" \
              '.tag_name == $tag and .target_commitish == $commit and (.body // "" | contains($marker))' \
              <<< "$release_info" >/dev/null; then
              echo "Deleting GitHub release v${VERSION} created by this run..."
              gh release delete "v${VERSION}" --yes 2>/dev/null || true
            else
              echo "GitHub release v${VERSION} does not match this run; leaving it untouched."
            fi
          fi

          if [ "$TAG_CREATE_ATTEMPTED" = "true" ] && [ -n "$RUN_COMMIT_SHA" ]; then
            remote_tag_sha="$(git ls-remote --refs origin "refs/tags/v${VERSION}" 2>/dev/null | awk '{print $1}' || true)"
            if [ "$remote_tag_sha" = "$RUN_COMMIT_SHA" ]; then
              echo "Deleting tag v${VERSION} created by this run..."
              git push --force-with-lease="refs/tags/v${VERSION}:${RUN_COMMIT_SHA}" origin ":refs/tags/v${VERSION}" 2>/dev/null || true
            else
              echo "Remote tag v${VERSION} does not point to this run's commit; leaving it untouched."
            fi
          fi

          if [ -n "$BASE_SHA" ] && [ "$(git rev-parse HEAD)" != "$BASE_SHA" ]; then
            echo "Restoring main to ${BASE_SHA}..."
            git push --force-with-lease=refs/heads/main:"$(git rev-parse HEAD)" origin "+${BASE_SHA}:refs/heads/main"
          fi
