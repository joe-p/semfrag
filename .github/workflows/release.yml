name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Check out the branch tip rather than the pushed commit, so a queued run
      # releases everything that has landed on main since.
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # npm is still used to publish: it supports OIDC trusted publishing,
      # which bun publish does not (oven-sh/bun#22423).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # This is only needed so we can test the semfrag bin from this PR rather than latest release
      - name: Put the built CLI on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/semfrag-dev"
          printf '#!/bin/sh\nexec bun "%s/dist/cli.js" "$@"\n' "$PWD" > "$RUNNER_TEMP/semfrag-dev/semfrag"
          chmod +x "$RUNNER_TEMP/semfrag-dev/semfrag"
          echo "$RUNNER_TEMP/semfrag-dev" >> "$GITHUB_PATH"

      - name: Prepare release
        id: semfrag
        uses: ./actions/prepare
        with:
          install: false

      - name: Bump package.json version
        if: steps.semfrag.outputs.released == 'true'
        env:
          VERSION: ${{ steps.semfrag.outputs.version }}
        run: bun pm pkg set "version=${VERSION}"

      - name: Build standalone binaries
        if: steps.semfrag.outputs.released == 'true'
        env:
          VERSION: ${{ steps.semfrag.outputs.version }}
        run: bun run scripts/build-binaries.ts

      - name: Commit, tag and create GitHub release
        if: steps.semfrag.outputs.released == 'true'
        uses: ./actions/publish
        with:
          assets: build/binaries/*

      - name: Publish to npm
        if: steps.semfrag.outputs.released == 'true'
        env:
          VERSION: ${{ steps.semfrag.outputs.version }}
        run: |
          if npm view "semfrag@${VERSION}" version >/dev/null 2>&1; then
            echo "semfrag@${VERSION} is already published."
          else
            npm publish --access public
          fi

      - name: Roll back failed release
        if: failure() || cancelled()
        uses: ./actions/rollback
