name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Check out the branch tip rather than the pushed commit, so a queued run
      # releases everything that has landed on main since.
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # This is only needed so we can test the semfrag binary from this run
      # rather than the latest release.
      - name: Put the built CLI on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/semfrag-dev"
          go build -o "$RUNNER_TEMP/semfrag-dev/semfrag" ./cmd/semfrag
          echo "$RUNNER_TEMP/semfrag-dev" >> "$GITHUB_PATH"

      - name: Prepare release
        id: semfrag
        uses: ./actions/prepare
        with:
          install: false

      - name: Update the version file
        if: steps.semfrag.outputs.released == 'true'
        env:
          VERSION: ${{ steps.semfrag.outputs.version }}
        run: printf '%s\n' "$VERSION" > VERSION

      - name: Build standalone binaries
        if: steps.semfrag.outputs.released == 'true'
        env:
          VERSION: ${{ steps.semfrag.outputs.version }}
        run: bash scripts/build-binaries.sh

      - name: Commit, tag and create GitHub release
        if: steps.semfrag.outputs.released == 'true'
        uses: ./actions/publish
        with:
          assets: build/binaries/*

      - name: Roll back failed release
        if: failure() || cancelled()
        uses: ./actions/rollback
